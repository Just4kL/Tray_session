[package]
name = "game-session-tracker"
version = "0.7.33-beta.1"
edition = "2021"
description = "Game Session Tracker — авто-подсчёт времени игр с GPU-гейтом (Rust/egui)"
authors = ["Game Session Tracker"]

[dependencies]
eframe = "0.28"
egui = "0.28"
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
csv = "1.3"
open = "5"
rfd = "0.15"
notify-rust = "4"
tray-icon = "0.20"
arboard = "3"
nvml-wrapper = "0.11"
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "mmsystem", "synchapi", "errhandlingapi", "winerror"] }
# Иконки разделов рисуются вектором (nav_icon_shapes), растровые PNG и крейт
# `image` больше не нужны.

[profile.release]
opt-level = 2
strip = true
